name: flutter_ui_mcp_embedded
description: "Pluggable on-device embedded LLM engine for Flutter MCP Suite using llamadart (llama.cpp / WebGPU / WASM)."
version: 1.4.1
homepage: https://github.com/lschaffer/flutter_mcp_suite
repository: https://github.com/lschaffer/flutter_mcp_suite/tree/main/flutter_ui_mcp_embedded

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dart_mcp_core: ^1.4.0
  flutter_ui_mcp_core: ^1.4.1
  llamadart: ^0.16.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

