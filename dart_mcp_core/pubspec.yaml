  http: ^1.6.0
  uuid: ^4.6.0
  openai_dart: '>=8.1.0 <10.0.0'
  anthropic_sdk_dart: '>=8.0.0 <10.0.0'
  ollama_dart: '>=2.6.1 <4.0.0'
  googleai_dart: '>=12.0.1 <14.0.0'
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  test: ^1.32.0
  lints: ^6.0.0
