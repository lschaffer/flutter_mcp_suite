name: flutter_genui_mcp
description: "Dynamic Generative UI (GenUI) widget for Flutter. Connect to LLMs, execute MCP tools, and render dynamic interactive generative UI widgets."
version: 1.0.1
homepage: https://github.com/lschaffer/flutter_mcp_suite
repository: https://github.com/lschaffer/flutter_mcp_suite/tree/main/flutter_genui_mcp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.4.0
  dart_mcp_core: ^1.0.1
  flutter_ui_mcp_core: ^1.0.1
  genui: ^0.10.3
  genai_primitives: ^0.2.4
  json_schema_builder: ^0.1.7
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  dart_mcp_core:
    path: ../dart_mcp_core
  flutter_ui_mcp_core:
    path: ../flutter_ui_mcp_core

