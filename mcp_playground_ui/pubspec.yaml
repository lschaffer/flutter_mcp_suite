name: mcp_playground_ui
description: "Shared UI components, dialogs, drawers, controllers, and services for MCP Playground and GenUI Playground."
version: 0.4.0
homepage: https://github.com/lschaffer/mcp_playground
repository: https://github.com/lschaffer/mcp_playground/tree/main/mcp_playground_ui

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.3.0
  mcp_playground_dart: ^0.3.2
  http: ^1.6.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  openai_dart: ^8.1.0
  anthropic_sdk_dart: ^8.0.0
  ollama_dart: ^2.6.1
  llamadart: ^0.8.23
  flutter_markdown_plus: ^1.0.12
  file_picker: ^12.0.0
  googleai_dart: ^12.0.1
  url_launcher: ^6.3.2
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_widget_from_html: ^0.17.4
  archive: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  mcp_playground_dart:
    path: ../mcp_playground_dart
