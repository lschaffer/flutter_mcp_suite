name: example_device_diagnostics
description: "Flutter MCP Playground example for system diagnostics, device telemetry, and network latency probing."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  mcp_playground_flutter:
    path: ../../../mcp_playground_flutter
  mcp_playground_ui:
    path: ../../../mcp_playground_ui
  mcp_playground_dart:
    path: ../../../mcp_playground_dart
  http: ^1.6.0
  material_ui: ^1.3.0
dependency_overrides:
  mcp_playground_dart:
    path: ../../../mcp_playground_dart
  mcp_playground_ui:
    path: ../../../mcp_playground_ui
  mcp_playground_flutter:
    path: ../../../mcp_playground_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../../.env
