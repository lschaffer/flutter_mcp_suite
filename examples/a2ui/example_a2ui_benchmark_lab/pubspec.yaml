name: example_a2ui_benchmark_lab
description: "GenUI Model and Prompt Benchmark Lab evaluating LLM response quality, latency, and cost trade-offs with scorecards and radar charts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_a2ui_mcp:
    path: ../../../flutter_a2ui_mcp
  dart_mcp_core: ^1.5.10
  flutter_ui_mcp_core: ^1.5.10
  json_schema_builder: ^0.1.7
  fl_chart: ^1.2.0
  material_ui: ^1.8.0

dependency_overrides:
  dart_mcp_core:
    path: ../../../dart_mcp_core
  flutter_ui_mcp_core:
    path: ../../../flutter_ui_mcp_core
  flutter_a2ui_mcp:
    path: ../../../flutter_a2ui_mcp
  a2ui_core: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
