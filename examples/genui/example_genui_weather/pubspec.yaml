name: example_genui_weather
description: "Standalone dynamic GenUI weather generator example with custom forms, fl_chart visualizations, and JPG export."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  genui_mcp_playground:
    path: ../../../genui_mcp_playground
  mcp_playground_dart: ^0.3.2
  mcp_playground_ui: ^0.4.0
  http: ^1.6.0
  fl_chart: ^1.2.0
  genui: ^0.10.3
  image: ^4.8.0
  file_picker: ^12.2.0
  material_ui: ^1.3.0
dependency_overrides:
  mcp_playground_dart:
    path: ../../../mcp_playground_dart
  mcp_playground_ui:
    path: ../../../mcp_playground_ui
  genui_mcp_playground:
    path: ../../../genui_mcp_playground

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../../.env
