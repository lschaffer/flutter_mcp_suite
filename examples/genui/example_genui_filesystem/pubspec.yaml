name: mcp_playground_flutter_example_genui_filesystem
description: "A GenUI example showcasing model-generated interactive filesystem explorer widgets inside GenuiMcpPlayground."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_genui_mcp:
    path: ../../../flutter_genui_mcp
  flutter_ui_mcp_core:
    path: ../../../flutter_ui_mcp_core
  dart_mcp_core:
    path: ../../../dart_mcp_core
  genui: ^0.10.3
  json_schema_builder: ^0.1.7
  path: ^1.9.1
  path_provider: ^2.1.6
  http: ^1.6.0
  material_ui: ^1.3.0
dependency_overrides:
  dart_mcp_core:
    path: ../../../dart_mcp_core
  flutter_ui_mcp_core:
    path: ../../../flutter_ui_mcp_core
  flutter_genui_mcp:
    path: ../../../flutter_genui_mcp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../../.env
