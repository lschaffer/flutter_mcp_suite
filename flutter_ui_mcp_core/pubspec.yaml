name: flutter_ui_mcp_core
description: "Shared UI components, dialogs, drawers, controllers, and services for the Flutter MCP Suite ecosystem."
version: 1.1.0
homepage: https://github.com/lschaffer/flutter_mcp_suite
repository: https://github.com/lschaffer/flutter_mcp_suite/tree/main/flutter_ui_mcp_core

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.4.0
  dart_mcp_core: ^1.1.0
  http: ^1.6.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  openai_dart: '>=8.1.0 <10.0.0'
  anthropic_sdk_dart: '>=8.0.0 <10.0.0'
  ollama_dart: '>=2.6.1 <4.0.0'
  llamadart: ^0.8.24
  flutter_markdown_plus: ^1.0.12
  file_picker: ^13.1.0
  googleai_dart: '>=12.0.1 <14.0.0'
  url_launcher: ^6.3.2
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_widget_from_html: ^0.17.4
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  dart_mcp_core:
    path: ../dart_mcp_core

