name: mcp_playground_shared_tools
description: "Shared weather, SSH, and chart tools implementation for mcp_playground examples."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  mcp_playground_dart: ^0.3.2
  http: ^1.6.0
  dartssh2: ^2.18.0
  mime: ^2.0.0
  fl_chart: ^1.2.0

dependency_overrides:
  mcp_playground_dart:
    path: ../../../mcp_playground_dart
