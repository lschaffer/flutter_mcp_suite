name: genui_mcp_playground_example
description: "Example application for genui_mcp_playground showing dynamic GenUI widgets, catalog items, and MCP tools."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  genui_mcp_playground:
    path: ../
  mcp_playground_dart: ^0.2.2
  mcp_playground_ui: ^0.1.0
  mcp_playground_shared_tools:
    path: shared_tools
  http: ^1.6.0
  fl_chart: ^1.2.0
  genui: ^0.10.2
  json_schema_builder: ^0.1.3

dependency_overrides:
  mcp_playground_dart:
    path: ../../mcp_playground_dart
  mcp_playground_ui:
    path: ../../mcp_playground_ui
  genui_mcp_playground:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../.env
