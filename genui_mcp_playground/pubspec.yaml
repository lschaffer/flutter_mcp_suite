name: genui_mcp_playground
description: "Interactive GenUI AI Agent Playground widget for Flutter. Connect to LLMs, execute MCP tools, and render dynamic interactive generative UI widgets."
version: 0.4.0
homepage: https://github.com/lschaffer/mcp_playground
repository: https://github.com/lschaffer/mcp_playground/tree/main/genui_mcp_playground

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.3.0
  mcp_playground_dart: ^0.3.2
  mcp_playground_ui: ^0.4.0
  genui: ^0.10.3
  genai_primitives: ^0.2.4
  json_schema_builder: ^0.1.7
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  file_picker: ^13.0.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

