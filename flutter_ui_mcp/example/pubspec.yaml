name: mcp_playground_flutter_example
description: "A consolidated showcase demonstrating MCP Playground Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ui_mcp:
    path: ../
  dart_mcp_core: ^1.2.0
  flutter_ui_mcp_core: ^1.2.0
  mcp_playground_shared_tools:
    path: shared_tools
  http: ^1.6.0
  dartssh2: ^4.1.0
  mime: ^2.0.0
  fl_chart: ^1.2.0
  material_ui: ^1.8.0
  example_progressive_tools:
    path: ../../examples/flutter/example_progressive_tools
  example_dynamic_skills:
    path: ../../examples/flutter/example_dynamic_skills
  example_subagents_orchestrator:
    path: ../../examples/flutter/example_subagents_orchestrator
  example_episodic_memory:
    path: ../../examples/flutter/example_episodic_memory
  example_agent_eval:
    path: ../../examples/flutter/example_agent_eval
  example_multimodal_vision:
    path: ../../examples/flutter/example_multimodal_vision
  example_audio_notes:
    path: ../../examples/flutter/example_audio_notes
  example_github_triage:
    path: ../../examples/flutter/example_github_triage
  example_device_diagnostics:
    path: ../../examples/flutter/example_device_diagnostics
dependency_overrides:
  dart_mcp_core:
    path: ../../dart_mcp_core
  flutter_ui_mcp_core:
    path: ../../flutter_ui_mcp_core
  flutter_ui_mcp:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.0

flutter:
  uses-material-design: true
  assets:
    - ../../.env
