name: mcp_playground_flutter_example
description: "A consolidated showcase demonstrating MCP Playground Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ui_mcp:
    path: ../
  dart_mcp_core: ^1.0.2
  flutter_ui_mcp_core: ^1.0.2
  mcp_playground_shared_tools:
    path: shared_tools
  http: ^1.6.0
  dartssh2: ^2.18.0
  mime: ^2.0.0
  fl_chart: ^1.2.0
  material_ui: ^1.4.0
dependency_overrides:
  dart_mcp_core:
    path: ../../dart_mcp_core
  flutter_ui_mcp_core:
    path: ../../flutter_ui_mcp_core
  flutter_ui_mcp:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - ../../.env
