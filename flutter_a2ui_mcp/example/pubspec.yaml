name: a2ui_mcp_playground_example
description: "Example application for flutter_a2ui_mcp showing dynamic A2UI widgets, catalog items, and MCP tools."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_a2ui_mcp:
    path: ../
  dart_mcp_core: ^1.5.9
  flutter_ui_mcp_core: ^1.5.9
  a2ui_flutter: ^0.3.0
  a2ui_core: ^0.7.0
  json_schema_builder: ^0.1.7
  http: ^1.6.0
  fl_chart: ^1.2.0

dependency_overrides:
  dart_mcp_core:
    path: ../../dart_mcp_core
  flutter_ui_mcp_core:
    path: ../../flutter_ui_mcp_core
  flutter_a2ui_mcp:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
