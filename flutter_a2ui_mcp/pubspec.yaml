name: flutter_a2ui_mcp
description: "Dynamic Agent-to-User Interface (A2UI) widget for Flutter. Connect to LLMs, execute MCP tools, and render dynamic interactive generative A2UI widgets."
version: 1.0.0
homepage: https://github.com/lschaffer/flutter_mcp_suite
repository: https://github.com/lschaffer/flutter_mcp_suite/tree/main/flutter_a2ui_mcp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  dart_mcp_core: ^1.5.10
  flutter_ui_mcp_core: ^1.5.10
  a2ui_flutter: ^0.3.0
  a2ui_core: ^0.7.0
  a2ui_agent: ^0.3.0
  json_schema_builder: ^0.1.7
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  file_picker: ^13.2.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

